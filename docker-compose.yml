services:
  db:
    image: postgres:17
    profiles:
      - prod
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 0.5s
      timeout: 1s
      retries: 20

  backend:
    build:
      context: .
      target: release
    profiles:
      - prod
    ports:
      - "${APP_PORT}:${APP_PORT}"
    volumes:
      - ./src/backend:/sandwichotek/src/backend
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432

volumes:
  postgres_data:
