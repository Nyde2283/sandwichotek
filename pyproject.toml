[project]
name = "sandwichotek"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "sqlmodel (>=0.0.37,<0.0.38)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "fastapi (>=0.135.3,<0.136.0)",
    "uvicorn (>=0.43.0,<0.44.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "sqlalchemy-data-model-visualizer (>=0.1.3,<0.2.0)",
]

[dependency-groups]
test = [
    "pytest (>=9.0.3,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
]

[tool.poetry.group.test]
optional = true

[tool.poetry]
package-mode = false
